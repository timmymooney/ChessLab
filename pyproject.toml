[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ChessLab"
version = "0.1.0"
description = "Personal chess performance analytics."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

authors = [
{name = "timmymooney"}
]

dependencies = [
"pandas>=2.0",
"python-chess>=1.999",
"requests>=2.31",
"streamlit>=1.30",
"plotly>=5.18",
"pytest>=8.0",
]


[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
